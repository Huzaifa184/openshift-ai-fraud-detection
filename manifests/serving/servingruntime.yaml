apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: fraude-detection
  namespace: fraud-detection-mlops
  annotations:
    opendatahub.io/apiProtocol: REST
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
    opendatahub.io/runtime-version: v2026.1.0
    opendatahub.io/template-display-name: OpenVINO Model Server
    opendatahub.io/template-name: kserve-ovms
    openshift.io/display-name: OpenVINO Model Server
  labels:
    opendatahub.io/dashboard: "true"

spec:
  annotations:
    opendatahub.io/kserve-runtime: ovms
    prometheus.io/path: /metrics
    prometheus.io/port: "8888"

  containers:
    - name: kserve-container
      image: registry.redhat.io/rhoai/odh-openvino-model-server-rhel9@sha256:1ab58519c50e2c3a9ebf0fee6d0708b1b5a0ae972aefcc722d87b2f62239a033

      args:
        - --model_name={{.Name}}
        - --port=8001
        - --rest_port=8888
        - --model_path=/mnt/models
        - --file_system_poll_wait_seconds=0
        - --metrics_enable

      ports:
        - containerPort: 8888
          protocol: TCP

  multiModel: false

  protocolVersions:
    - v2
    - grpc-v2

  supportedModelFormats:
    - name: openvino_ir
      version: opset13
      autoSelect: true

    - name: onnx
      version: "1"

    - name: tensorflow
      version: "1"
      autoSelect: true

    - name: tensorflow
      version: "2"
      autoSelect: true

    - name: paddle
      version: "2"
      autoSelect: true

    - name: pytorch
      version: "2"
      autoSelect: true
